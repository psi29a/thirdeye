name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Persist vcpkg's built packages in the GitHub Actions cache so dependencies
    # are built from source only once, then restored on later runs.
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    strategy:
      matrix:
        # ubuntu-26.04: libsdl3-dev landed in 25.04 (plucky) and is in the
        # 26.04 LTS archive; ubuntu-latest (24.04 noble) doesn't ship it.
        os: [ubuntu-26.04, macos-latest, windows-latest]
        config: [Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build build-essential libsdl3-dev libopenal-dev libwildmidi-dev

      # `brew update` is the slow part (~30s on a clean macos-latest runner that
      # already ships with a recent brew). The formulae we need (cmake/ninja/sdl3/
      # openal-soft/wildmidi) are stable; the preinstalled brew is fresh enough.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja sdl3 openal-soft wildmidi

      # Expose the GitHub Actions cache endpoint/token to vcpkg's x-gha binary
      # source (set via VCPKG_BINARY_SOURCES above).
      - name: Export GitHub Actions cache variables (Windows)
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Cache the entire vcpkg tree (the tool + installed/). On a hit we skip
      # clone + bootstrap + install entirely (~9 min -> seconds). The key is a
      # MANUAL version (vcpkg-v<N>): bump only when the install command below
      # changes (new package, different triplet, vcpkg pinning, ...). Don't
      # use hashFiles() over this workflow -- any unrelated CI edit (e.g.
      # adding ccache, tweaking artifacts) would invalidate a perfectly good
      # 300 MB cache. VCPKG_BINARY_SOURCES = x-gha is still useful for partial
      # restores when THIS directory cache does miss (after a bump or weekly
      # eviction): vcpkg install then pulls per-package binary caches instead
      # of building from source.
      - name: Cache vcpkg
        if: runner.os == 'Windows'
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: ~/vcpkg
          key: vcpkg-${{ runner.os }}-v2-sdl3-openal-soft-wildmidi
          restore-keys: |
            vcpkg-${{ runner.os }}-v2-

      # cmake, ninja and git are preinstalled on the windows-latest image, so we
      # only need vcpkg. (Installing via choco modifies the machine PATH, which
      # does not propagate into the same step's environment.)
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:USERPROFILE\vcpkg
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat"
          & "$env:USERPROFILE\vcpkg\vcpkg.exe" install sdl3 openal-soft wildmidi --triplet x64-windows

      # Ensure Ninja is on PATH for later steps. (gha-setup-ninja registers it
      # via $GITHUB_PATH, which — unlike choco — propagates across steps.)
      - name: Set up Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@master

      # The Ninja generator needs cl.exe on PATH, which requires the MSVC
      # developer environment to be activated.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Compiler caching: ccache hashes preprocessor output + flags, returns the
      # cached .o on a hit. After one warm run, an unchanged TU compiles in
      # milliseconds. ccache 4.x supports MSVC, so one variant covers all three
      # platforms. The action handles install + GHA cache wiring; we just point
      # CMake at it via CMAKE_*_COMPILER_LAUNCHER below.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.config }}
          max-size: 500M
          verbose: 1

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        shell: bash

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_TOOLCHAIN_FILE="$env:USERPROFILE\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -- -j 2

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.config }}
        shell: bash

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # runtests.exe needs the vcpkg runtime DLLs (SDL3, OpenAL, WildMidi) on PATH.
          $env:PATH = "$env:USERPROFILE\vcpkg\installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build --output-on-failure -C ${{ matrix.config }}

      - name: Package artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          tar -czf artifacts/thirdeye-${{ matrix.os }}.tgz build/thirdeye build/daesop build/thirdeye.app || true
        shell: bash

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactDir = "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          # Copy the vcpkg runtime DLLs (SDL3, OpenAL32, libWildMidi, ...) next to
          # the executables so the zipped artifact runs standalone.
          $vcpkgBin = "$env:USERPROFILE\vcpkg\installed\x64-windows\bin"
          Copy-Item -Path "$vcpkgBin\*.dll" -Destination build -Force
          Compress-Archive -Path build\thirdeye.exe,build\daesop.exe,build\*.dll -DestinationPath "$artifactDir\thirdeye-${{ matrix.os }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: thirdeye-${{ matrix.os }}
          path: artifacts
